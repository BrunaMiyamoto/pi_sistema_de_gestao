<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Projeto intergrador desenvolvido para o eixo de computação da Univesp.Desenvolvimento de Sistema Web para Gestão de Solicitações e Pedidos Industriais"
    />
    <meta
      name="author"
      content="Alexandre Tetsuo Eto, Amanda Vitória Rosa, Bruna Yukari Kuwabara Miyamoto,Gicélio Alves Correia,Ingrid Aparecida Aquino Soares e Ygor Martins Godoi"
    />
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#111826] min-h-screen flex">
    <main class="mx-auto my-auto px-4 py-8">
      <section class="bg-[#1D242F] rounded-xl m-4 p-8 min-w-sm">
        <div class="flex items-center py-4 justify-center">
          <div class="bg-[#E19047] p-0.5 rounded-sm m-2">
            <i class="fa-solid fa-gear" style="color: rgb(30, 48, 80)"></i>
          </div>
          <p class="font-bold text-white">Jacto</p>
          <p class="text-[#E19047] font-bold">Flow</p>
        </div>
        <div class="flex flex-col items-center">
          <h2 class="text-white font-bold text-xl">Acessar JactoFlow</h2>
          <p class="text-slate-500 text-xs">
            Gestão de solicitações técnicas industriais
          </p>
        </div>

        <form>
          <div class="flex flex-col py-4">
            <label class="text-white font-semibold pb-2">E-mail</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="usuario@jacto.com.br"
              class="bg-[#111826] rounded-lg text-slate-500 py-1 px-2 border border-slate-700"
            />
          </div>

          <div class="flex flex-col py-1">
            <label class="text-white font-semibold pb-2">Senha</label>
            <input
              type="password"
              name="senha"
              id="senha"
              placeholder="*********"
              class="bg-[#111826] rounded-lg text-slate-500 py-1 px-2 border border-slate-700"
            />
          </div>

          <div
            class="flex justify-end underline text-[#E19047] text-xs py-2 cursor-pointer"
          >
            <a>Esqueceu sua senha?</a>
          </div>

          <a
            href="dashboard.html"
            class="inline-block text-center bg-[#E19047] font-bold py-1.5 w-full rounded-lg cursor-pointer mt-4 hover:bg-[#F29949] hover:text-slate-700"
          >
            Entrar no Sistema
          </a>
        </form>
      </section>
    </main>
    <footer></footer>
  </body>
  <script src="app.js"></script>
</html>
